name: Migrate hub once (review branch only)
on:
  push:
    branches: [reorganize-hub]
    paths: ['.github/workflows/migrate-hub-once.yml']
permissions:
  contents: write
concurrency:
  group: migrate-hub-once
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/reorganize-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reorganize-hub
          fetch-depth: 0
      - name: Preserve file contents and migrate folders
        run: |
          python3 scripts/migrate_hub.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Move existing content into hub folders without changing bytes'
            git push origin HEAD:reorganize-hub
          fi
      - name: Package review source without Git credentials
        run: git archive --format=zip --output=/tmp/hub-migrated-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hub-migrated-source
          path: /tmp/hub-migrated-source.zip
          retention-days: 14
