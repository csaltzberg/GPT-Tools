const $=id=>document.getElementById(id),duckEl=$('duck'),callBtn=$('call'),layBtn=$('lay'),modeBtn=$('mode'),joystickEl=$('joystick'),joystickKnob=$('joystickKnob'),honk=$('honk'),foodEl=$('food'),eggsEl=$('eggs'),hatchEl=$('hatch'),chicksEl=$('chicks'),savedEl=$('saved'),lostEl=$('lost'),timerEl=$('attackTimer'),warningEl=$('warning');
const duck={x:innerWidth/2,y:playH()*.65,w:120,h:120,right:false},gyro={on:false,beta:0,gamma:0,baseB:0,baseG:0,cal:false},joystick={pointerId:null,x:0,y:0,maxRadius:47},keys={},eggs=[],chicks=[],bread=[];let controlMode='touch';let attacksSinceGator=2;let food=C.startFood,lastCall=-Infinity,lastLay=-Infinity,lastFree=-Infinity,rallyUntil=0,saved=0,lost=0,predator=null,nextBread=0,attack={type:pickPred(),at:0,warn:false};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay),remove=(a,x)=>{const i=a.indexOf(x);if(i>=0)a.splice(i,1)},fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);function playH(){return innerHeight*(1-C.control)}function ref(){return Math.min(innerWidth,playH())}function pickPred(){if(attacksSinceGator>=2){attacksSinceGator=0;return'gator'}const r=Math.random(),type=r<C.hawkProb?'hawk':r<C.hawkProb+C.snakeProb?'snake':'gator';attacksSinceGator=type==='gator'?0:attacksSinceGator+1;return type}function pEmoji(t){return t==='hawk'?'🦅':t==='snake'?'🐍':'🐊'}function pName(t){return t==='hawk'?'HAWK':t==='snake'?'SNAKE':'ALLIGATOR'}
function measureDuck(){const r=duckEl.getBoundingClientRect();if(r.width&&r.height){duck.w=r.width;duck.h=r.height}}
function constrainDuck(){measureDuck();duck.x=clamp(duck.x,0,innerWidth);duck.y=clamp(duck.y,0,playH())}
function renderDuck(){constrainDuck();duckEl.style.left=duck.x+'px';duckEl.style.top=duck.y+'px';duckEl.style.transform=`translate(-50%,-100%) scaleX(${duck.right?-1:1})`}
function duckCenter(){return{x:duck.x,y:duck.y-duck.h/2}}function rallyPoint(){const c=duckCenter(),rearX=duck.right?c.x-duck.w/2:c.x+duck.w/2;return{x:(c.x+rearX)/2,y:(c.y+duck.y)/2}}function headPoint(){const r=duckEl.getBoundingClientRect();return{x:duck.right?r.right-r.width*.15:r.left+r.width*.15,y:r.top+r.height*.16}}
function ripples(){const h=headPoint();for(let i=0;i<3;i++)setTimeout(()=>{const r=document.createElement('div');r.className='ripple';r.style.left=h.x+'px';r.style.top=h.y+'px';document.body.appendChild(r);r.onanimationend=()=>r.remove()},i*190)}function playHonk(){try{honk.currentTime=0;honk.play().catch(()=>{})}catch{}}

function breadDrop(){const person=document.createElement('div'),left=Math.random()<.5,px=left?18:innerWidth-18,py=rand(90,playH()*.46),cx=rand(innerWidth*.18,innerWidth*.82),cy=rand(playH()*.28,playH()*.77),count=Math.floor(rand(C.breadPiecesMin,C.breadPiecesMax+1));person.className='person';person.textContent='🧑';person.style.left=px+'px';person.style.top=py+'px';person.style.transform=`translate(-50%,-50%) scaleX(${left?-1:1})`;document.body.appendChild(person);for(let i=0;i<count;i++)setTimeout(()=>makeBread(cx+rand(-85,85),cy+rand(-65,65)),i*135);setTimeout(()=>{person.style.opacity='0';setTimeout(()=>person.remove(),280)},2400);scheduleBread()}
function removeBread(b){if(!b||!b.active)return false;b.active=false;b.el.remove();remove(bread,b);return true}function nearestBread(x,y,max=Infinity){let best=null,bd=max;for(const b of bread)if(b.active){const d=dist(x,y,b.x,b.y);if(d<bd){bd=d;best=b}}return best}
function collectDuckBread(){const c=duckCenter();for(let i=bread.length-1;i>=0;i--){const b=bread[i];if(b.active&&dist(c.x,c.y,b.x,b.y)<=C.duckBreadRadius&&removeBread(b))addFood(C.duckBreadGain,b.x,b.y)}}
function layEgg(){const now=performance.now();if(now-lastLay<C.layCd)return;if(!spendFood(C.eggCost)){layBtn.classList.add('unavailable');return}lastLay=now;cool(layBtn,C.layCd);const p=rallyPoint(),off=24*rand(.1,1),eggDuration=rand(C.eggHatchMin,C.eggHatchMax),e={stage:'egg',x:p.x+(Math.random()<.5?-1:1)*off,y:p.y+(Math.random()<.5?-1:1)*off,el:document.createElement('div'),active:true,stageStart:now,stageEnd:now+eggDuration};e.el.className='world small egg';e.el.textContent='🥚';e.el.style.left=e.x+'px';e.el.style.top=e.y+'px';e.el.style.transform='translate(-50%,-50%)';document.body.appendChild(e.el);eggs.push(e);updateUI();e.t1=setTimeout(()=>{if(!e.active)return;const hatchNow=performance.now(),hatchDuration=rand(C.hatchChickMin,C.hatchChickMax);e.stage='hatch';e.stageStart=hatchNow;e.stageEnd=hatchNow+hatchDuration;e.el.textContent='🐣';updateUI();e.t2=setTimeout(()=>toChick(e),hatchDuration)},eggDuration)}
function toChick(e){if(!e.active)return;e.active=false;remove(eggs,e);e.el.className='world small duckling';e.el.textContent='🐤';const c={el:e.el,x:e.x,y:e.y,vx:0,vy:0,until:0,pause:0,active:true,mode:'wander',hunger:rand(.05,.25),target:null};chicks.push(c);startSeg(c,performance.now(),modeFor(c));updateUI()}
function removeEgg(e){if(!e||!e.active)return false;e.active=false;clearTimeout(e.t1);clearTimeout(e.t2);e.el.remove();remove(eggs,e);updateUI();return true}function removeChick(c){if(!c||!c.active)return false;c.active=false;c.el.remove();remove(chicks,c);updateUI();return true}
function baseChickSpeed(){return innerWidth*C.chickFrac/3000}function modeFor(c,now=performance.now()){if((attack.warn&&attack.type==='hawk')||(predator&&predator.type==='hawk'&&predator.state==='attacking'))return'panic';if(now<rallyUntil)return'rally';if(c.hunger>=C.hungerThreshold){const t=nearestBread(c.x,c.y,innerWidth*C.forageRadius);if(t){c.target=t;return'forage'}}c.target=null;return'wander'}
function startSeg(c,now,mode){let speed=baseChickSpeed()*rand(.4,1),angle,dur;if(mode==='panic'){const p=rallyPoint();speed*=rand(3,5);angle=Math.atan2(p.y-c.y,p.x-c.x)+rand(-.2,.2);dur=rand(500,1200)}else if(mode==='rally'){const p=rallyPoint();speed*=rand(1,5);angle=Math.atan2(p.y-c.y,p.x-c.x)+rand(-Math.PI/4,Math.PI/4);dur=rand(C.segMin,C.segMax)}else if(mode==='forage'&&c.target&&c.target.active){speed*=C.forageSpeed;angle=Math.atan2(c.target.y-c.y,c.target.x-c.x)+rand(-.14,.14);dur=rand(500,1500)}else{angle=rand(0,Math.PI*2);dur=rand(C.segMin,C.segMax)}c.vx=Math.cos(angle)*speed;c.vy=Math.sin(angle)*speed;c.until=now+dur;c.mode=mode}
function updateChicks(dt,now){const ds=dt/1000;for(const c of chicks){if(!c.active)continue;c.hunger=clamp(c.hunger+C.hungerRate*ds,0,1);const m=modeFor(c,now);if(c.mode!==m){c.pause=0;startSeg(c,now,m)}if(c.pause&&now<c.pause)continue;if(!c.until||now>=c.until){if(m==='wander'&&Math.random()<C.pauseChance){c.pause=now+rand(C.pauseMin,C.pauseMax);continue}startSeg(c,now,m)}c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.x<12||c.x>innerWidth-12)c.vx*=-1;if(c.y<12||c.y>playH()-12)c.vy*=-1;c.x=clamp(c.x,12,innerWidth-12);c.y=clamp(c.y,12,playH()-12);c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';c.el.style.transform=`translate(-50%,-50%) scaleX(${c.vx>0?-1:1})`;const t=c.target&&c.target.active?c.target:nearestBread(c.x,c.y,C.chickBreadRadius);if(t&&dist(c.x,c.y,t.x,t.y)<=C.chickBreadRadius&&removeBread(t)){c.hunger=C.hungerAfter;c.target=null;c.until=0;addFood(C.chickBreadGain,t.x,t.y)}}}

function attackDelay(){const red=saved*500,min=Math.max(C.attackFloor,C.attackMin-red*.35),max=Math.max(min+3000,C.attackMax-red);return rand(min,max)}function scheduleAttack(now=performance.now()){attack.type=pickPred();attack.at=now+attackDelay();attack.warn=false;warningEl.classList.remove('visible');timerEl.classList.remove('warning')}

function updatePred(dt){if(!predator)return;const ds=dt/1000,oldX=predator.x;if(predator.type==='hawk'){const s=ref()*C.hawkSpeed;if(predator.state==='attacking'){if(!predator.target||!predator.target.active)predator.target=closestChick(predator.x,predator.y);if(predator.target){const d=moveToward(predator,predator.target.x,predator.target.y,s,ds);if(d<24){if(removeChick(predator.target))lost++;fleePred();updateUI()}}else predator.x+=predator.flee*s*ds}else{predator.x+=predator.flee*s*1.15*ds;predator.y-=s*.5*ds}if(predator&&(predator.x<-120||predator.x>innerWidth+120||predator.y<-120))endPred()}else if(predator.type==='snake'){const s=ref()*C.snakeSpeed,c=duckCenter();if(predator.state==='attacking'){if(dist(predator.x,predator.y,c.x,c.y)<=ref()*C.snakeRepel){saved++;updateUI();fleePred()}else{if(!predator.target||!predator.target.active)predator.target=closestEgg(predator.x,predator.y);if(predator.target){const tx=predator.target.x,ty=clamp(predator.target.y,playH()*.34,playH()*.66),d=moveToward(predator,tx,ty,s,ds);if(d<22){if(removeEgg(predator.target))lost++;fleePred();updateUI()}}else predator.x+=(predator.left?1:-1)*s*ds}}else predator.x+=predator.flee*s*1.2*ds;if(predator&&(predator.x<-110||predator.x>innerWidth+110))endPred()}else{const s=ref()*C.gatorSpeed,c=duckCenter();if(predator.state==='attacking'){if(dist(predator.x,predator.y,c.x,c.y)<=ref()*C.gatorRepel){saved++;updateUI();fleePred()}else{if(!predator.target||!predator.target.active||predator.target.y<predator.minY)predator.target=closestGatorChick(predator.x,predator.y,predator.minY);if(predator.target){const tx=predator.target.x,ty=clamp(predator.target.y,predator.minY,predator.maxY),d=moveToward(predator,tx,ty,s,ds);predator.y=Math.max(predator.y,predator.minY);if(d<30){if(removeChick(predator.target))lost++;fleePred();updateUI()}}else{predator.y-=s*.55*ds;predator.y=Math.max(predator.y,predator.minY);if(performance.now()>=predator.leaveAt)fleePred()}}}else{predator.y+=s*1.1*ds;predator.x+=predator.flee*s*.30*ds}if(predator&&(predator.y>playH()+120||predator.x<-130||predator.x>innerWidth+130))endPred()}if(predator){const movedX=predator.x-oldX;if(Math.abs(movedX)>.001)predator.dirX=movedX}renderPred()}function updateAttack(now){if(predator){timerEl.textContent=`${pEmoji(predator.type)} ATTACK`;timerEl.classList.add('warning');return}const rem=attack.at-now,t=Math.max(0,Math.ceil(rem/1000));timerEl.textContent=`${pEmoji(attack.type)} 00:${String(t).padStart(2,'0')}`;if(rem<=C.warning&&!attack.warn)showWarn();if(rem<=0){hideWarn();spawnPred(attack.type)}}
function repelHawk(){const now=performance.now();if(attack.warn&&(attack.type==='hawk'||attack.type==='gator')&&!predator){saved++;hideWarn();scheduleAttack(now);updateUI();return}if(predator&&(predator.type==='hawk'||predator.type==='gator')&&predator.state==='attacking'){const c=duckCenter(),radius=ref()*(predator.type==='hawk'?C.hawkRepel:C.gatorRepel);if(dist(predator.x,predator.y,c.x,c.y)<=radius){saved++;fleePred();updateUI()}}}
function cool(btn,ms){btn.classList.add('cooldown');setTimeout(()=>btn.classList.remove('cooldown'),ms)}function triggerHonk(){const now=performance.now();if(now-lastCall<C.callCd)return;const free=now-lastFree>=C.freeHonk;if(free)lastFree=now;else if(!spendFood(C.honkCost))return;lastCall=now;cool(callBtn,C.callCd);playHonk();ripples();rallyUntil=Math.max(rallyUntil,now+rand(C.rallyMin,C.rallyMax));repelHawk()}
function updateUI(){let e=0,h=0;for(const x of eggs)if(x.active)(x.stage==='egg'?e++:h++);foodEl.textContent=`🍞 ${fmt(food)}`;eggsEl.textContent=`🥚 ${e}`;hatchEl.textContent=`🐣 ${h}`;chicksEl.textContent=`🐤 ${chicks.filter(c=>c.active).length}`;savedEl.textContent=`⭐ ${saved}`;lostEl.textContent=`💀 ${lost}`;layBtn.classList.toggle('unavailable',food<C.eggCost)}
function updateIncubationAnimations(now){for(const e of eggs){if(!e.active||!e.stageStart||!e.stageEnd)continue;const total=Math.max(1,e.stageEnd-e.stageStart),progress=clamp((now-e.stageStart)/total,0,1),intensity=clamp((progress-.40)/.60,0,1);if(intensity<=0){e.el.style.transform='translate(-50%,-50%)';continue}const stageBoost=e.stage==='hatch'?1.22:1,frequency=1.2+intensity*5.8,phase=(now/1000)*Math.PI*2*frequency+(e.x+e.y)*.025,angle=Math.sin(phase)*(1.2+7.5*intensity)*stageBoost,pulse=1+Math.sin(phase*1.17)*(.008+.07*intensity)*stageBoost;e.el.style.transform=`translate(-50%,-50%) rotate(${angle.toFixed(2)}deg) scale(${pulse.toFixed(3)})`}}
function depth(){const els=[duckEl,...document.querySelectorAll('.egg,.duckling,.predator,.bread')].map(el=>({el,b:el.getBoundingClientRect().bottom})).sort((a,b)=>a.b-b.b);els.forEach((o,i)=>o.el.style.zIndex=String(100+i))}setInterval(depth,C.parallax)
function bind(btn,fn){btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('pressed');btn.setPointerCapture?.(e.pointerId);fn()});for(const ev of['pointerup','pointercancel','lostpointercapture','pointerleave'])btn.addEventListener(ev,()=>btn.classList.remove('pressed'))}bind(callBtn,triggerHonk);bind(layBtn,layEgg);bind(modeBtn,cycleControlMode)
function touchMove(e){if(controlMode!=='touch')return;e.preventDefault();for(const t of e.touches){if(t.clientY>=playH())continue;const dx=t.clientX-duck.x;if(Math.abs(dx)>.5)duck.right=dx>0;duck.x=t.clientX;duck.y=t.clientY;renderDuck();break}}document.addEventListener('touchstart',touchMove,{passive:false});document.addEventListener('touchmove',touchMove,{passive:false})
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();triggerHonk()}if(e.key.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false)
async function enableGyro(){if(gyro.on)return true;if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){try{if(await DeviceOrientationEvent.requestPermission()!=='granted')return false}catch{return false}}gyro.on=true;gyro.cal=true;addEventListener('deviceorientation',orientation,true);return true}function disableGyro(){gyro.on=false;gyro.cal=false;removeEventListener('deviceorientation',orientation,true)}function orientation(e){gyro.beta=e.beta??0;gyro.gamma=e.gamma??0;if(gyro.cal){gyro.baseB=gyro.beta;gyro.baseG=gyro.gamma;gyro.cal=false}}
function resetJoystick(){joystick.x=0;joystick.y=0;joystick.pointerId=null;joystickEl.classList.remove('active');joystickKnob.style.transform='translate(-50%,-50%)'}
function updateModeUI(){modeBtn.classList.remove('mode-touch','mode-gyro','mode-joystick','active-mode');joystickEl.classList.remove('visible');if(controlMode==='touch'){modeBtn.textContent='👆';modeBtn.classList.add('mode-touch');modeBtn.setAttribute('aria-label','Touch-follow movement mode')}else if(controlMode==='gyro'){modeBtn.textContent='📱';modeBtn.classList.add('mode-gyro','active-mode');modeBtn.setAttribute('aria-label','Gyroscope movement mode')}else{modeBtn.textContent='🕹️';modeBtn.classList.add('mode-joystick','active-mode');modeBtn.setAttribute('aria-label','Virtual joystick movement mode');joystickEl.classList.add('visible')}}
async function cycleControlMode(){if(controlMode==='touch'){const ok=await enableGyro();controlMode=ok?'gyro':'joystick'}else if(controlMode==='gyro'){disableGyro();controlMode='joystick'}else{resetJoystick();controlMode='touch'}updateModeUI()}
function updateJoystickFromPointer(e){const r=joystickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),limit=joystick.maxRadius,scale=d>limit?limit/d:1,mx=dx*scale,my=dy*scale;joystick.x=mx/limit;joystick.y=my/limit;joystickKnob.style.transform=`translate(calc(-50% + ${mx}px),calc(-50% + ${my}px))`}
joystickEl.addEventListener('pointerdown',e=>{if(controlMode!=='joystick')return;e.preventDefault();joystick.pointerId=e.pointerId;joystickEl.setPointerCapture?.(e.pointerId);joystickEl.classList.add('active');updateJoystickFromPointer(e)});joystickEl.addEventListener('pointermove',e=>{if(e.pointerId!==joystick.pointerId)return;e.preventDefault();updateJoystickFromPointer(e)});for(const ev of['pointerup','pointercancel','lostpointercapture'])joystickEl.addEventListener(ev,e=>{if(joystick.pointerId!==null&&e.pointerId!==undefined&&e.pointerId!==joystick.pointerId)return;resetJoystick()});
function moveDuck(dt){const ds=dt/1000;if(controlMode==='gyro'&&gyro.on&&!gyro.cal){const gx=Math.abs(gyro.gamma-gyro.baseG)<C.gyroDead?0:gyro.gamma-gyro.baseG,gy=Math.abs(gyro.beta-gyro.baseB)<C.gyroDead?0:gyro.beta-gyro.baseB,nx=clamp(gx/C.gyroFull,-1,1),ny=clamp(gy/C.gyroFull,-1,1);duck.x+=nx*innerWidth*C.gyroMax*ds;duck.y+=ny*playH()*C.gyroMax*ds;if(Math.abs(nx)>.02)duck.right=nx>0;renderDuck();return}if(controlMode==='joystick'){const magnitude=Math.min(1,Math.hypot(joystick.x,joystick.y));if(magnitude>.02){const speed=ref()*.38;duck.x+=joystick.x*speed*ds;duck.y+=joystick.y*speed*ds;if(Math.abs(joystick.x)>.02)duck.right=joystick.x>0;renderDuck()}return}let x=0,y=0;if(keys.ArrowLeft)x--;if(keys.ArrowRight)x++;if(keys.ArrowUp)y--;if(keys.ArrowDown)y++;if(x||y){const l=Math.hypot(x,y),s=ref()*.38;duck.x+=x/l*s*ds;duck.y+=y/l*s*ds;if(x)duck.right=x>0;renderDuck()}}
let last=performance.now();function frame(now){const dt=Math.min(now-last,50);last=now;moveDuck(dt);collectDuckBread();updateChicks(dt,now);updateIncubationAnimations(now);updatePred(dt);updateAttack(now);if(now>=nextBread)breadDrop();requestAnimationFrame(frame)}
function init(){renderDuck();updateUI();updateModeUI();scheduleAttack();scheduleBread();depth();requestAnimationFrame(frame)}addEventListener('resize',()=>{renderDuck();depth()});document.addEventListener('contextmenu',e=>e.preventDefault());init();
</script>
